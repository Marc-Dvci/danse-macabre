# Static analysis of the TypeScript. Its runs and badge are public; its alerts are visible only to people with write
# access.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
